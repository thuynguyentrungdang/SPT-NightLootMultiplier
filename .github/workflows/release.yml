name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  MOD_NAME: NightLootMultiplier
  PROJECT_PATH: Night Loot Multiplier/NightLootMultiplier.csproj
  PROJECT_DIR: Night Loot Multiplier
  METADATA_PATH: Night Loot Multiplier/ModMetadata.cs

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify tag matches ModMetadata version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $content = Get-Content "${{ env.METADATA_PATH }}" -Raw
          if ($content -notmatch 'Version\s*\{\s*get;\s*init;\s*\}\s*=\s*new\("([^"]+)"\)') {
            throw "Version not found in ModMetadata.cs"
          }
          if ($Matches[1] -ne $tag) {
            throw "Tag v$tag != ModMetadata.Version $($Matches[1])"
          }

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build (Release)
        run: dotnet build "${{ env.PROJECT_PATH }}" -c Release --no-restore

      - name: Package
        shell: pwsh
        run: |
          # csproj OutputPath is bin\Release\$(ProjectName)\$(AssemblyName)\, but $(ProjectName)
          # evaluates empty at that point in the SDK import order (only gets its default from
          # common targets imported later), so the real output dir has one name segment, not two.
          $outDir = "${{ env.PROJECT_DIR }}/bin/Release/${{ env.MOD_NAME }}"
          $stage = "stage/user/mods/${{ env.MOD_NAME }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$outDir/*.dll" -Destination $stage
          $cfg = "${{ env.PROJECT_DIR }}/config"
          if (Test-Path $cfg) {
            Copy-Item $cfg "$stage/config" -Recurse
          }
          Compress-Archive -Path "stage/*" -DestinationPath "${{ env.MOD_NAME }}-${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MOD_NAME }}-${{ github.ref_name }}.zip
          generate_release_notes: true
